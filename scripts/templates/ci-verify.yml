# Starter CI workflow — the ONE plane that binds every agent, in any tool.
#
# .agents/policy.md only fences the agent that reads it. This workflow is what actually blocks a bad merge
# from any agent — because it runs on the server, not on anyone's machine, and a required status check
# cannot be skipped with `--no-verify`.
#
# TO MAKE IT REAL (two steps, both done by a human once):
#   1. Copy this file to .github/workflows/verify.yml and replace each <CMD> with the command from
#      the architecture-boundary check (the same ones your pre-commit gate runs).
#   2. In repo Settings → Branches, add a branch-protection rule on the default branch that marks
#      the "verify" check REQUIRED and forbids force-push / direct push. Until you do step 2, this
#      workflow reports but does not block — see AGENTS.md → "Enforcement — the honest version".
#
# Not on GitHub? The same four gates belong in your CI of choice (GitLab CI, CircleCI, Buildkite…);
# the point is server-side + required, not the vendor.

name: verify
on:
  pull_request:
  push:
    branches: [main]   # <- your default branch

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the docs gate can diff against the PR base

      # --- Set up your toolchain here (node/python/go/…); delete the ones you do not use. ---
      # - uses: actions/setup-node@v4
      #   with: { node-version-file: '.nvmrc', cache: 'npm' }
      # - run: <INSTALL_CMD>

      # Agent-mirror drift — fails if any tool-native generated mirror or the AGENTS.md rules block is stale vs
      # AGENTS.md + .agents/rules/*.md. This is what keeps every tool's inlined ruleset honest.
      - name: Agent mirrors in sync
        run: sh scripts/sync-agents.sh --check

      # Docs landing gate — fails if any commit in this PR changed code but not the worklog.
      # Uses the PR base SHA (not a hardcoded branch name) so it works on any default branch and
      # on the first commit; the ref-guard in check-docs.sh fails loudly rather than silently passing.
      - name: Docs in sync
        run: sh scripts/check-docs.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Plan-home gate — fails if any plan/roadmap doc lives outside docs/agents/. Keeps one
      # canonical plan per project (docs/agents/roadmap.md) so an agent picking the repo up can
      # never read the wrong one. Adopting a repo with a backlog of strays? Fold them first, or
      # set PLAN_HOME_OFF=1 here until you have.
      - name: Plan home
        run: sh scripts/check-plan-home.sh

      - name: Typecheck
        run: <TYPECHECK_CMD>          # the architecture-boundary check

      - name: Lint
        run: <LINT_CMD>

      - name: Test
        run: <TEST_CMD>

      # Architecture-boundary check — fails on any import that points outward across a layer.
      # Delete this step only if the repo has no boundary linter wired yet (MODULE:arch dropped).
      - name: Architecture boundaries
        run: <ARCH_CHECK_CMD>         # dependency-cruiser / import-linter / ArchUnit / …

      # Agent-readiness gate — the mechanical floor for dual-mode apps (.agents/rules/agent-readiness.md).
      # Checks the agent card exists + is served, mutations are idempotent, MCP schemas are generated
      # not hand-written, no vendor LLM endpoint is hardcoded outside its adapter, and a scoped
      # non-human principal exists. Delete this step if MODULE:agent was pruned.
      # Mid-adoption? set AGENT_READINESS_ENFORCE: warn here TEMPORARILY and track the gap in
      # docs/agents/in-progress.md — it reports without blocking, and leaving it on is a silent gate.
      - name: Agent readiness
        run: sh scripts/check-agent-readiness.sh --since "${{ github.event.pull_request.base.sha }}"

      # Expert-review gate — fails if non-trivial PR lacks review evidence:
      # plan.md exists, checklist.md has items, adr.md has new section, PR has ≥2 persona sign-offs.
      # Trivial escape: PR label "trivial", commit prefix "trivial:", or 1-file ≤15-line no-schema change.
      - name: Expert review
        run: sh scripts/check-expert-review.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Optional but recommended: a secret scan so a leaked credential fails the PR.
      # - name: Secret scan
      #   uses: gitleaks/gitleaks-action@v2
